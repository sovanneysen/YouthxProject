name: youthx
description: "YouthX - Growth Center, Community, Messenger & Stories"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # UI / Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  # State management, DI & routing
  get: ^4.6.6
  # Networking / realtime
  web_socket_channel: ^3.0.3
  http: ^1.2.1
  dio: ^5.7.0
  # Secure storage (JWT) / local prefs
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  # Client-side crypto (approved stack)
  crypto: ^3.0.6
  encrypt: ^5.0.3
  # Remote images
  cached_network_image: ^3.4.1
  # Media
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.0
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true