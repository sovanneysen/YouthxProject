name: youthx_app
description: "YouthX - Community, Messenger & Stories"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management, DI & routing (controllers/views/binding architecture)
  get: ^4.6.6

  # Networking / realtime
  web_socket_channel: ^3.0.3
  http: ^1.2.1

  # Media
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.3

  # Utilities
  intl: ^0.20.3
  uuid: ^4.4.0
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
